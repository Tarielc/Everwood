<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- user-scalable=no stops a double-tap on a control from zooming the page,
         viewport-fit=cover lets the canvas reach under a notch instead of being inset -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="/style.css">
    <title>Everwood</title>
    <meta name="description" content="A pixel-art action platformer you can play in the browser - fight through the wood, survive the arena's endless waves and put your run on the leaderboard." />

    <!-- what LinkedIn, Discord and the rest build a link preview from. VITE_SITE_URL is
         filled in at build time (see the vite configs) - previews need absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Everwood" />
    <meta property="og:title" content="Everwood" />
    <meta property="og:description" content="A pixel-art action platformer you can play in the browser - fight through the wood, survive the arena's endless waves and put your run on the leaderboard." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/assets/ui/load-bg.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
